<!doctype html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="og:title" property="og:title" content="Fall Guys: Builds Archive" />
        <meta name="description" content="Website of the Fall Guys builds archive" />
        <meta name="og:description" property="og:description" content="Website of the Fall Guys builds archive" />
        <meta name="og:image" property="og:image" content="favicon-512x512.webp" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="Fall Guys: Builds Archive" />
        <meta name="twitter:description" content="Website of the Fall Guys builds archive" />
        <meta name="twitter:image" content="favicon-512x512.webp" />
        <meta content="#f73ca3" name="theme-color" />
        <title>FG: Builds Archive</title>
        <link rel="icon" href="/favicon.ico" type="image/x-icon" />
        <link href="https://www.nerdfonts.com/assets/css/webfont.css" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet" />
    </head>

    <body>
        <nav id="mainNavbar" class="navbar bg-dark-override" data-bs-theme="dark">
            <div class="container">
                <div class="row w-100 align-items-center gx-2">
                    <div class="col d-flex align-items-center overflow-hidden px-0">
                        <div class="navbar-brand d-flex align-items-center mb-0" style="min-width: 0">
                            <img src="/favicon-512x512.webp" width="32" height="32" class="d-inline-block align-top rounded me-2" alt="beta icon" />
                            <span class="titan-one-font text-truncate text-white">FG: Builds Archive</span>
                        </div>
                    </div>

                    <div class="col-auto d-flex align-items-center justify-content-end gap-2 px-0">
                        <select
                            id="seasonFilter"
                            class="form-select form-select-sm border-secondary bg-dark-override text-white"
                            style="min-width: 120px; max-width: 150px"
                        >
                            <option value="" data-i18n="filter.all"></option>
                        </select>

                        <button id="toggleThemeBtn" class="btn btn-sm btn-outline-secondary">
                            <i id="themeIcon" class="bi text-white"></i>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="flex-fill">
            <div id="listContainer" class="container py-3">
                <ul class="nav nav-tabs" id="typeTabs" role="tablist"></ul>
                <div id="tabAlert"></div>
                <div class="tab-content" id="typeTabContent"></div>
            </div>
        </main>

        <footer id="footerInfo" class="container-fluid border-top py-3 bg-dark-override" data-bs-theme="dark">
            <div class="row align-items-start">
                <div id="footerLeft" class="col-md-9 col-12 d-flex flex-column gap-1 text-start">
                    <div id="footerMainText" class="fw-semibold text-white" data-i18n="footer.poweredBy"></div>
                    <div id="footerSelected" style="font-weight: 500" class="text-white-50"></div>
                    <div id="footerTotal" style="font-size: 0.9rem; font-weight: 500" class="text-white-50"></div>
                    <div id="footerNotes" style="font-size: 0.7rem" class="text-white-50"></div>
                </div>
                <div id="footerRight" class="col-md-3 col-12 d-flex flex-column align-items-md-end align-items-start gap-2 mt-3 mt-md-0">
                </div>
            </div>
        </footer>

        <div class="modal fade" id="modal_build_info" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-xl">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" data-i18n="modal.buildDetails"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body row">
                        <div class="col-md-6" id="modalData"></div>
                        <div class="col-md-6" id="modalSegments"></div>
                    </div>
                    <div class="modal-footer" id="modalFooter"></div>
                </div>
            </div>
        </div>
    </body>
    
    <script type="module" src="/src/index.ts"></script>
</html>
