<!doctype html>
<html lang="en">
    <head>
        <style>
            html {
                background-color: #212529 !important;
            }

            html[data-bs-theme="light"] {
                background-color: #fff !important;
            }

            html::after {
                content: "";
                position: fixed;
                inset: 0;
                background-color: #212529;
                z-index: 2147483647;
                pointer-events: none;
                transition: opacity 0.75s ease;
            }

            html[data-bs-theme="light"]::after {
                background-color: #fff;
            }

            html.fga-show::after {
                opacity: 0;
            }
        </style>
        <script>
            (() => {
                //s tier gecko fix
                document.documentElement.dataset.bsTheme =
                    document.cookie.match(/(?:^|;\s*)theme=(dark|light)(?:;|$)/)?.[1] ??
                    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            })();
        </script>
        <title>Fall Guys Archive</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="og:title" property="og:title" content="Fall Guys Archive" />
        <meta name="description" content="Website of the Fall Guys archive" />
        <meta name="og:description" property="og:description" content="Website of the Fall Guys archive" />
        <meta name="og:image" property="og:image" content="static/favicon-512x512.webp" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="Fall Guys Archive" />
        <meta name="twitter:description" content="Website of the Fall Guys archive" />
        <meta name="twitter:image" content="static/favicon-512x512.webp" />
        <meta content="#f73ca3" name="theme-color" />
        <link rel="manifest" href="/manifest.json" />
        <link rel="icon" href="static/favicon.ico" type="image/x-icon" />
        <link rel="apple-touch-icon" sizes="57x57" href="static/apple-icon-57x57.png" />
        <link rel="apple-touch-icon" sizes="60x60" href="static/apple-icon-60x60.png" />
        <link rel="apple-touch-icon" sizes="72x72" href="static/apple-icon-72x72.png" />
        <link rel="apple-touch-icon" sizes="76x76" href="static/apple-icon-76x76.png" />
        <link rel="apple-touch-icon" sizes="114x114" href="static/apple-icon-114x114.png" />
        <link rel="apple-touch-icon" sizes="120x120" href="static/apple-icon-120x120.png" />

        <link rel="apple-touch-icon" sizes="152x152" href="static/apple-icon-152x152.png" />

    </head>

    <body>
        <nav id="mainNavbar" class="navbar sticky-top bg-dark-override" data-bs-theme="dark">
            <div class="container">
                <div class="d-flex align-items-center w-100 flex-nowrap">
                    <div class="flex-shrink-1 overflow-hidden">
                        <a href="/" class="navbar-brand d-flex align-items-center mb-0">
